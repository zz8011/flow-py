[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-py"
version = "0.1.0"
description = "Unofficial Python CLI & SDK for Google Flow AI (flow.google.com) & Flow Music (flowmusic.app / Lyria 3.5) — video, image & music generation automation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["google-flow", "flow-music", "ai", "video-generation", "image-generation", "music-generation", "automation", "veo", "omni", "imagen", "nano-banana", "lyria"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "black",
    "ruff",
]

[project.scripts]
flow = "flow.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
